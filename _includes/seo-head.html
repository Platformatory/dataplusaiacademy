<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ include.title }}</title>
<meta name="description" content="{{ include.description }}">
{% if include.keywords %}<meta name="keywords" content="{{ include.keywords }}">{% endif %}

<!-- SEO & Social Media -->
<meta name="robots" content="{{ include.robots | default: 'index, follow' }}">
<link rel="canonical" href="{{ include.canonical | default: page.url | absolute_url }}">
<meta property="og:title" content="{{ include.og_title | default: include.title }}">
<meta property="og:description" content="{{ include.og_description | default: include.description }}">
<meta property="og:image" content="{{ include.og_image | default: '/img/Data+AI.png' | absolute_url }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ include.og_title | default: include.title }}">
<meta name="twitter:description" content="{{ include.og_description | default: include.description }}">
<meta name="twitter:image" content="{{ include.og_image | default: '/img/Data+AI.png' | absolute_url }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="icon" type="image/png" href="{{ '/favicon/favicon-96x96.png' | relative_url }}" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="{{ '/favicon/favicon.svg' | relative_url }}" />
<link rel="shortcut icon" href="{{ '/favicon/favicon.ico' | relative_url }}" />
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/favicon/apple-touch-icon.png' | relative_url }}" />
<meta name="apple-mobile-web-app-title" content="Data+AI Academy" />
<link rel="manifest" href="{{ '/favicon/site.webmanifest' | relative_url }}" />
<script src="https://cdn.tailwindcss.com"></script>
