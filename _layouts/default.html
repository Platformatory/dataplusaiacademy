<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    {% if page.keywords %}<meta name="keywords" content="{{ page.keywords }}">{% endif %}

    <!-- SEO & Social Media -->
    <meta name="robots" content="{{ page.robots | default: 'noindex, nofollow' }}">
    <meta property="og:title" content="{{ page.og_title | default: page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.og_description | default: page.description | default: site.description }}">
    <meta property="og:image" content="{{ page.og_image | default: '/img/Data+AI.png' | absolute_url }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ site.title }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" type="image/png" href="{{ '/favicon/favicon-96x96.png' | relative_url }}" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="{{ '/favicon/favicon.svg' | relative_url }}" />
    <link rel="shortcut icon" href="{{ '/favicon/favicon.ico' | relative_url }}" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/favicon/apple-touch-icon.png' | relative_url }}" />
    <meta name="apple-mobile-web-app-title" content="Data+AI Academy" />
    <link rel="manifest" href="{{ '/favicon/site.webmanifest' | relative_url }}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{{ '/js/events.js' | relative_url }}"></script>
    <script src="{{ '/js/courses.js' | relative_url }}"></script>
    <style>
        html {
            scroll-behavior: smooth;
            scroll-padding-top: 90px;
        }
    </style>
</head>

<body class="font-['Inter',sans-serif] bg-[#FCFCF9] text-[#1A1A1A] leading-[1.6] antialiased">

    {% include nav.html %}

    {{ content }}

    {% include footer.html %}

    <script>
        function initPage() {
            // Typing Animation Logic
            initTypingAnimation();

            // Announcement Banner: shows the soonest upcoming event from data/events.json
            initAnnouncementBanner();

            // Course facts (duration, delivery, upcoming batch) from data/courses.json
            initCourses();

            // Counter Logic
            const counters = document.querySelectorAll(".counter");
            if (counters.length > 0) {
                const animateCounter = (counter) => {
                    const target = parseFloat(counter.getAttribute("data-target"));
                    const isFloat = target % 1 !== 0;
                    const duration = 1500; // ms
                    const startTime = performance.now();

                    const update = (currentTime) => {
                        const elapsed = currentTime - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                        const ease = 1 - Math.pow(1 - progress, 4); // Ease out quart
                        const current = target * ease;

                        if (isFloat) {
                            counter.innerText = current.toFixed(1);
                        } else {
                            counter.innerText = Math.floor(current);
                        }

                        if (progress < 1) {
                            requestAnimationFrame(update);
                        } else {
                            counter.innerText = target;
                        }
                    };
                    requestAnimationFrame(update);
                };

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            animateCounter(entry.target);
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.5 });

                counters.forEach(counter => observer.observe(counter));
            }
            // Footer Year Logic
            const yearSpan = document.getElementById("current-year");
            if (yearSpan) {
                yearSpan.textContent = new Date().getFullYear();
            }

            // Nav Menu Logic (mobile toggle + close on link click)
            const navToggle = document.getElementById("nav-menu-toggle");
            const navPanel = document.getElementById("nav-menu-panel");
            if (navToggle && navPanel) {
                const closeNavPanel = () => {
                    navPanel.classList.add("hidden");
                    navPanel.classList.remove("flex");
                    navToggle.setAttribute("aria-expanded", "false");
                    navToggle.querySelector("i").className = "fas fa-bars text-lg";
                };
                navToggle.addEventListener("click", () => {
                    const isOpen = !navPanel.classList.contains("hidden");
                    if (isOpen) {
                        closeNavPanel();
                    } else {
                        navPanel.classList.remove("hidden");
                        navPanel.classList.add("flex");
                        navToggle.setAttribute("aria-expanded", "true");
                        navToggle.querySelector("i").className = "fas fa-times text-lg";
                    }
                });
                navPanel.querySelectorAll("a").forEach(link => {
                    link.addEventListener("click", closeNavPanel);
                });
            }
        }

        // Typing Animation Logic
        function initTypingAnimation() {
            const typingElement = document.getElementById('typing-text');
            const articleElement = document.getElementById('typing-article');
            if (!typingElement) return;

            const phrases = ["Platform Engineer.", "Data Engineer.", "AI Engineer."];
            let phraseIndex = 0;
            let charIndex = phrases[0].length; // Start fully typed
            let isDeleting = true; // Start by deleting after a pause
            let typeSpeed = 100;

            function type() {
                const currentPhrase = phrases[phraseIndex];

                if (isDeleting) {
                    typingElement.textContent = currentPhrase.substring(0, charIndex - 1);
                    charIndex--;
                    typeSpeed = 50;
                } else {
                    typingElement.textContent = currentPhrase.substring(0, charIndex + 1);
                    charIndex++;
                    typeSpeed = 150;
                }

                if (!isDeleting && charIndex === currentPhrase.length) {
                    isDeleting = true;
                    typeSpeed = 2000; // Pause at full phrase
                } else if (isDeleting && charIndex === 0) {
                    isDeleting = false;
                    phraseIndex = (phraseIndex + 1) % phrases.length;
                    typeSpeed = 500; // Pause before new phrase

                    if (articleElement) {
                        articleElement.textContent = /^[aeiou]/i.test(phrases[phraseIndex]) ? 'an' : 'a';
                    }
                }

                setTimeout(type, typeSpeed);
            }

            // Initial delay before starting the delete cycle
            setTimeout(type, 2000);
        }

        document.addEventListener("DOMContentLoaded", initPage);
    </script>
    <!-- WhatsApp Support Button -->
    <a href="https://wa.me/917411527327" target="_blank" rel="noopener noreferrer"
        class="fixed bottom-8 right-8 z-50 bg-[#25D366] text-white p-4 rounded-full shadow-lg hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex items-center justify-center group w-16 h-16">
        <i class="fab fa-whatsapp text-4xl"></i>
    </a>

</body>

</html>
