<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">

    <!-- SEO & Social Media -->
    <meta name="robots" content="{{ page.robots | default: 'index, follow' }}">
    <meta property="og:title" content="{{ page.og_title | default: page.title }}">
    <meta property="og:description" content="{{ page.og_description | default: page.description }}">
    <meta property="og:image" content="{{ page.og_image | absolute_url }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ site.title }}">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.og_title | default: page.title }}">
    <meta name="twitter:description" content="{{ page.og_description | default: page.description }}">
    <meta name="twitter:image" content="{{ page.og_image | absolute_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" type="image/png" href="{{ '/favicon/favicon-96x96.png' | relative_url }}" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="{{ '/favicon/favicon.svg' | relative_url }}" />
    <link rel="shortcut icon" href="{{ '/favicon/favicon.ico' | relative_url }}" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/favicon/apple-touch-icon.png' | relative_url }}" />
    <meta name="apple-mobile-web-app-title" content="Data+AI Academy" />
    <link rel="manifest" href="{{ '/favicon/site.webmanifest' | relative_url }}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{{ '/js/events.js' | relative_url }}"></script>
    <style>
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>

<body class="font-['Inter',sans-serif] bg-[#FCFCF9] text-[#1A1A1A] leading-[1.6] antialiased"
    data-event-slug="{{ page.event_slug }}">

    {% include event-nav.html %}

    {{ content }}

    {% include footer.html %}

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const yearSpan = document.getElementById("current-year");
            if (yearSpan) yearSpan.textContent = new Date().getFullYear();
        });
        document.addEventListener("DOMContentLoaded", initEventDetail);
    </script>

    <!-- WhatsApp Support Button -->
    <a href="https://wa.me/917411527327" target="_blank" rel="noopener noreferrer"
        class="fixed bottom-8 right-8 z-50 bg-[#25D366] text-white p-4 rounded-full shadow-lg hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex items-center justify-center w-16 h-16">
        <i class="fab fa-whatsapp text-4xl"></i>
    </a>
</body>

</html>
